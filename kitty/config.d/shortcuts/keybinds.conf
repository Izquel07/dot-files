#==================================#
#= Atajaos de teclado / shortcuts =#
#==================================#

#===== Terminal font size =====#
map ctrl+plus           change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0 

#===== Funcionalidades =====#
map ctrl+enter          new_window

#===== Apps CLI launch
map ctrl+n              launch_tab nvim
map ctrl+d              launch_tab lazydocker
map ctrl+b              launch_tab btop
