general {
  hide_cursor = true
}

background {
  monitor = 
  path = screenshot


  blur_passes = 3
  color = rgba(0, 0, 0, 0)
}

label {
  monitor =
  text = cmd[update:1000] date +"%I:%M %p"
  font_size = 90
  position = 0, 0
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 300, 60
  outline_thickness = 2
  dots_size = 0.2
  dots_center = true

  outer_color = rgba(255, 255, 255, 1.0)
  inner_color = rgba(20, 20, 20, 0.8)
  font_color = rgba(255, 255, 255, 1.0)

  placeholder_text = Password...
  position = 0, -100
  halign = center
  valign = center
}
